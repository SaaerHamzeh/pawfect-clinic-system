<!-- Restore Modal -->
<div x-show="showRestoreModal" x-cloak class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div @click="showRestoreModal = false" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity">
        </div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>

        <div
            class="inline-block align-bottom bg-white rounded-2xl text-right overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full">
            <form :action="'/appointments/' + restoreAppointmentId + '/restore/'" method="POST">
                {% csrf_token %}
                <div class="bg-white p-6">
                    <div class="flex items-center gap-3 mb-4 text-amber-600">
                        <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </div>
                        <h3 class="text-lg font-bold text-gray-900">استعادة الموعد</h3>
                    </div>

                    <p class="text-sm text-gray-600 leading-relaxed">
                        هل تريد استعادة الموعد للمريض <strong class="text-gray-900"
                            x-text="restoreAnimalName"></strong> وإعادته إلى قائمة المواعيد النشطة؟
                    </p>
                </div>

                <div class="bg-gray-50 px-6 py-4 flex flex-row-reverse gap-2">
                    <button type="submit"
                        class="w-full sm:w-auto inline-flex justify-center rounded-xl px-5 py-2.5 btn-restore-confirm text-sm font-bold text-white shadow-sm transition cursor-pointer">
                        استعادة الآن
                    </button>
                    <button type="button" @click="showRestoreModal = false"
                        class="w-full sm:w-auto inline-flex justify-center rounded-xl px-5 py-2.5 btn-cancel text-sm cursor-pointer">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
