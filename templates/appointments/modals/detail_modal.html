<!-- Event Detail Modal (Opened on Calendar Event Click) -->
<div x-show="showDetailModal" x-cloak class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div @click="showDetailModal = false" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity">
        </div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>

        <div
            class="inline-block align-bottom bg-white rounded-2xl text-right overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full">
            <template x-if="selectedEvent">
                <div>
                    <div class="bg-white p-6">
                        <div class="flex items-center justify-between pb-3 border-b border-gray-100 mb-4">
                            <div>
                                <span class="text-xs font-mono text-gray-400"
                                    x-text="'موعد #' + selectedEvent.id"></span>
                                <h3 class="text-lg font-bold text-gray-900"
                                    x-text="selectedEvent.animal_name + ' (' + selectedEvent.species + ')'"></h3>
                            </div>
                            <span class="px-2.5 py-1 text-xs font-bold rounded-full"
                                :class="{
                                    'bg-blue-50 text-blue-700 border border-blue-200': selectedEvent.status === 'SCHEDULED',
                                    'bg-green-50 text-green-700 border border-green-200': selectedEvent.status === 'COMPLETED',
                                    'bg-red-50 text-red-700 border border-red-200': selectedEvent.status === 'CANCELLED',
                                    'bg-amber-50 text-amber-700 border border-amber-200': selectedEvent.status === 'NO_SHOW'
                                }"
                                x-text="selectedEvent.status_display"></span>
                        </div>

                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between py-1 border-b border-gray-50">
                                <span class="text-gray-500">الطبيب المعالج:</span>
                                <span class="font-bold text-gray-800"
                                    x-text="'د. ' + selectedEvent.doctor_name"></span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-gray-50">
                                <span class="text-gray-500">التاريخ والوقت:</span>
                                <span class="font-semibold text-gray-800 font-mono"
                                    x-text="selectedEvent.date + ' ' + selectedEvent.time"></span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-gray-50">
                                <span class="text-gray-500">مدة الموعد:</span>
                                <span class="font-medium text-gray-800"
                                    x-text="selectedEvent.duration + ' دقيقة (' + selectedEvent.appointment_type + ')'"></span>
                            </div>
                            <div x-show="selectedEvent.vaccine_name" class="flex justify-between py-1 border-b border-gray-50">
                                <span class="text-gray-500">نوع التطعيم:</span>
                                <span class="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded text-xs"
                                    x-text="selectedEvent.vaccine_name"></span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-gray-50">
                                <span class="text-gray-500">المالك الدائم:</span>
                                <span class="font-medium text-gray-800"
                                    x-text="selectedEvent.client_name + ' (' + selectedEvent.client_phone + ')'"></span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-gray-50">
                                <span class="text-gray-500">المُحضر في الزيارة:</span>
                                <span class="font-medium text-gray-800" x-text="selectedEvent.brought_by"></span>
                            </div>
                            <div>
                                <span class="text-xs text-gray-500 block mb-1">ملاحظات:</span>
                                <p class="text-xs text-gray-700 bg-slate-50 p-2 rounded-lg border border-gray-100"
                                    x-text="selectedEvent.notes || 'لا توجد ملاحظات'"></p>
                            </div>

                            <!-- Fast Status Update Controls -->
                            {% if can_manage_appointments %}
                            <div class="pt-3 border-t border-gray-100">
                                <label class="block text-xs font-semibold text-gray-600 mb-2">تحديث حالة الموعد مباشرة:</label>
                                <div class="flex flex-wrap gap-1.5">
                                    <button type="button" @click="quickUpdateStatus(selectedEvent.id, 'COMPLETED')"
                                        :disabled="selectedEvent.status === 'COMPLETED' || isUpdatingStatus"
                                        class="px-2.5 py-1 text-xs font-semibold rounded-lg transition cursor-pointer disabled:opacity-40"
                                        :class="selectedEvent.status === 'COMPLETED' ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-green-50 text-green-700 hover:bg-green-100 border border-green-200'">
                                        ✓ مكتمل
                                    </button>
                                    <button type="button" @click="quickUpdateStatus(selectedEvent.id, 'CANCELLED')"
                                        :disabled="selectedEvent.status === 'CANCELLED' || isUpdatingStatus"
                                        class="px-2.5 py-1 text-xs font-semibold rounded-lg transition cursor-pointer disabled:opacity-40"
                                        :class="selectedEvent.status === 'CANCELLED' ? 'bg-red-100 text-red-800 border border-red-300' : 'bg-red-50 text-red-700 hover:bg-red-100 border border-red-200'">
                                        ✕ ملغى
                                    </button>
                                    <button type="button" @click="quickUpdateStatus(selectedEvent.id, 'NO_SHOW')"
                                        :disabled="selectedEvent.status === 'NO_SHOW' || isUpdatingStatus"
                                        class="px-2.5 py-1 text-xs font-semibold rounded-lg transition cursor-pointer disabled:opacity-40"
                                        :class="selectedEvent.status === 'NO_SHOW' ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200'">
                                        ⚠️ لم يحضر
                                    </button>
                                    <button type="button" @click="quickUpdateStatus(selectedEvent.id, 'SCHEDULED')"
                                        :disabled="selectedEvent.status === 'SCHEDULED' || isUpdatingStatus"
                                        class="px-2.5 py-1 text-xs font-semibold rounded-lg transition cursor-pointer disabled:opacity-40"
                                        :class="selectedEvent.status === 'SCHEDULED' ? 'bg-blue-100 text-blue-800 border border-blue-300' : 'bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200'">
                                        📅 مجدول
                                    </button>
                                </div>
                            </div>
                            {% endif %}
                        </div>
                    </div>

                    <div class="bg-gray-50 px-6 py-4 flex flex-wrap justify-between items-center gap-2">
                        <a :href="'/patients/' + selectedEvent.animal_id + '/'"
                            class="text-xs font-semibold text-primary-600 hover:underline">
                            فتح ملف المريض ←
                        </a>

                            <!-- Edit Appointment from Detail -->
                            {% if can_manage_appointments %}
                            <button type="button" @click="editData = {
                                id: selectedEvent.id,
                                animal_id: selectedEvent.animal_id,
                                animal_name: selectedEvent.animal_name,
                                animal_id_code: selectedEvent.animal_id_code || '',
                                client_name: selectedEvent.client_name || '',
                                client_phone: selectedEvent.client_phone || '',
                                species_display: selectedEvent.species || '',
                                doctor_id: selectedEvent.doctor_id,
                                date: selectedEvent.date,
                                time: selectedEvent.time,
                                duration: selectedEvent.duration,
                                appointment_type: selectedEvent.raw_appointment_type || 'CHECKUP',
                                vaccine_name: selectedEvent.vaccine_name || '',
                                status: selectedEvent.status || 'SCHEDULED',
                                brought_by: selectedEvent.brought_by === 'المالك الدائم' ? '' : selectedEvent.brought_by,
                                notes: selectedEvent.notes === 'لا توجد ملاحظات' ? '' : selectedEvent.notes
                            }; isChangingEditPatient = false; showDetailModal = false; showEditModal = true"
                                class="px-3 py-1.5 btn-purple text-white rounded-lg text-xs font-semibold flex items-center gap-1 transition cursor-pointer">
                                <span class="inline-flex items-center gap-1">{% icon 'edit' 'w-3.5 h-3.5' %} تعديل كامل</span>
                            </button>
                            {% endif %}
                            <button type="button" @click="showDetailModal = false"
                                class="px-3 py-1.5 btn-cancel rounded-lg text-xs cursor-pointer">
                                إغلاق
                            </button>
                        </div>
                    </div>
            </template>
        </div>
    </div>
</div>
