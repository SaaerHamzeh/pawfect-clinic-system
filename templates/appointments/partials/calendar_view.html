<!-- CALENDAR VIEW -->
<div x-show="currentView === 'calendar'" x-cloak class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-6 transition-all">
    <!-- Calendar Top Action & Legend Bar -->
    <div class="mb-5 pb-4 border-b border-gray-100 flex flex-wrap justify-between items-center gap-3">
        <!-- Status Legends -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-xs font-semibold">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-purple-50 text-purple-800 border border-purple-200/70">
                <span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>
                <span>مجدول (Scheduled)</span>
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-teal-50 text-teal-800 border border-teal-200/70">
                <span class="w-2.5 h-2.5 rounded-full bg-teal-600"></span>
                <span>مكتمل (Completed)</span>
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-300 animate-pulse">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                <span>حان وقته الآن ⏰</span>
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-200/70">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-600"></span>
                <span>متأخر / لم يحضر</span>
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-red-50 text-red-800 border border-red-200/70">
                <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                <span>ملغى (Cancelled)</span>
            </span>
        </div>

        <!-- Refresh Button -->
        <button @click="refreshCalendar()"
            class="text-xs bg-slate-100 hover:bg-slate-200 text-gray-700 font-bold px-3.5 py-2 rounded-xl transition-all flex items-center gap-1.5 cursor-pointer shadow-sm">
            <span>تحديث التقويم</span>
            <span class="text-sm">↻</span>
        </button>
    </div>

    <!-- Calendar Mount -->
    <div id="calendar" class="min-h-[680px]"></div>
</div>
